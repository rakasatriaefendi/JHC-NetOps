name: P18 PostgreSQL 16 Integration Tests

on:
  push:
    branches: [p18-zero-idle-websocket]
  workflow_dispatch:
  pull_request:
    branches: [p18-zero-idle-websocket]
    paths:
      - 'backend/**'
      - '.github/workflows/p18-postgres-integration.yml'

permissions:
  contents: read

jobs:
  postgres-integration:
    name: PostgreSQL 16 Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install PostgreSQL 16 and create dedicated cluster
        run: |
          # Install PostgreSQL 16
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 postgresql-client-16

          # Stop default main cluster if running
          sudo pg_ctlcluster 16 main stop 2>/dev/null || true

          # Create dedicated cluster jhcnetops on port 5433 with required data directory
          sudo pg_createcluster 16 jhcnetops -d /var/lib/postgresql/16/jhcnetops -p 5433 --start

          # Verify cluster is running
          sudo pg_isready -p 5433 -h localhost

          # Configure trust authentication for local postgres user (CI only)
          sudo sed -i "s/local   all             postgres                                peer/local   all             postgres                                trust/" /etc/postgresql/16/jhcnetops/pg_hba.conf
          sudo sed -i "s/local   all             all                                     peer/local   all             all                                     trust/" /etc/postgresql/16/jhcnetops/pg_hba.conf
          sudo pg_ctlcluster 16 jhcnetops reload

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Provision database, roles, and asset schema (migrations 001-006)
        env:
          PGPASSWORD: postgres
        run: |
          # Create jhc_netops_owner role required by migrations 007+
          psql -p 5433 -U postgres -c "CREATE ROLE jhc_netops_owner WITH LOGIN SUPERUSER;"

          # Create jhc_netops_app role as NOLOGIN so it exists for migration GRANTs (007, 008, 011, 015, 016, 017, 019)
          # It will be ALTERed to LOGIN with password after all migrations complete.
          psql -p 5433 -U postgres -c "CREATE ROLE jhc_netops_app WITH NOLOGIN;"

          # Create database jhc_netops
          psql -p 5433 -U postgres -c "CREATE DATABASE jhc_netops;"

          # Apply asset schema migrations (001-006) - these create asset.assets and related tables
          for migration in backend/migrations/00[1-6]*.sql; do
            echo "Applying $migration"
            psql -p 5433 -U postgres -d jhc_netops -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Validate cluster identity before migration 007
        env:
          PGPASSWORD: postgres
        run: |
          echo "=== Cluster Identity Validation ==="
          psql -p 5433 -U postgres -d jhc_netops -c "
            SELECT
              current_database() AS database,
              current_setting('port') AS port,
              current_setting('server_version_num')::int AS version_num,
              current_setting('data_directory') AS data_directory,
              session_user AS session_user,
              inet_server_addr() AS server_addr,
              to_regclass('asset.assets') IS NOT NULL AS asset_assets_exists,
              to_regclass('public.application_schema_migrations') IS NOT NULL AS migrations_table_exists,
              (SELECT 1 FROM pg_roles WHERE rolname = 'jhc_netops_owner') IS NOT NULL AS owner_role_exists
          "

      - name: Apply production migrations (007-019)
        env:
          PGPASSWORD: postgres
        run: |
          for migration in backend/migrations/00[7-9]*.sql backend/migrations/01[0-9]*.sql; do
            echo "Applying $migration"
            psql -p 5433 -U postgres -d jhc_netops -v ON_ERROR_STOP=1 -f "$migration"
          done

          # Verify all migrations applied
          psql -p 5433 -U postgres -d jhc_netops -c "SELECT * FROM public.application_schema_migrations ORDER BY version;"

      - name: Create test application role and grant permissions
        env:
          PGPASSWORD: postgres
        run: |
          psql -p 5433 -U postgres -d jhc_netops -v ON_ERROR_STOP=1 -c "
            ALTER ROLE jhc_netops_app WITH LOGIN PASSWORD 'test_password';
            GRANT USAGE ON SCHEMA public TO jhc_netops_app;
            GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA public TO jhc_netops_app;
            GRANT USAGE,SELECT,UPDATE ON ALL SEQUENCES IN SCHEMA public TO jhc_netops_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO jhc_netops_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE,SELECT,UPDATE ON SEQUENCES TO jhc_netops_app;
            REVOKE INSERT,UPDATE,DELETE,TRUNCATE ON public.application_schema_migrations FROM jhc_netops_app;

            -- Also grant on asset schema
            GRANT USAGE ON SCHEMA asset TO jhc_netops_app;
            GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA asset TO jhc_netops_app;
            GRANT USAGE,SELECT,UPDATE ON ALL SEQUENCES IN SCHEMA asset TO jhc_netops_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA asset GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO jhc_netops_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA asset GRANT USAGE,SELECT,UPDATE ON SEQUENCES TO jhc_netops_app;
          "

      - name: Run PostgreSQL integration tests
        run: npm run test:postgres:integration
        working-directory: backend
        env:
          PGHOST: localhost
          PGPORT: 5433
          PGDATABASE: jhc_netops
          PGUSER: jhc_netops_app
          PGPASSWORD: test_password
          RUNNER_CONTROL_TOKEN: test-control-token-not-a-real-credential
          RUNNER_HEARTBEAT_TOKEN: test-heartbeat-token-not-a-real-credential
          PRESENCE_TOKEN: test-presence-token-not-a-real-credential

      - name: Run full test suite with real PostgreSQL
        run: npm test
        working-directory: backend
        env:
          PGHOST: localhost
          PGPORT: 5433
          PGDATABASE: jhc_netops
          PGUSER: jhc_netops_app
          PGPASSWORD: test_password
          RUNNER_CONTROL_TOKEN: test-control-token-not-a-real-credential
          RUNNER_HEARTBEAT_TOKEN: test-heartbeat-token-not-a-real-credential
          PRESENCE_TOKEN: test-presence-token-not-a-real-credential

      - name: Typecheck
        run: npm run typecheck
        working-directory: backend

      - name: Lint
        run: npm run lint
        working-directory: backend

      - name: Build
        run: npm run build
        working-directory: backend