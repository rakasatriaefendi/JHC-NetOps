[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "network-monitoring-agent"
version = "0.1.0"
description = "Portable local agent for the Network Monitoring project"
requires-python = ">=3.11"
dependencies = [
  "psutil",
  "python-dotenv",
  "requests",
  "scapy",
]

[project.scripts]
network-monitor = "network_monitoring_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["network_monitoring_agent"]
